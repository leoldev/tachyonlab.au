<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tachyon Lab — 06 Wayfinding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>document.documentElement.className += ' js';</script>
<style>
@font-face{
  font-family:'Tachyon Archivo Heavy';
  src:url('../brand/fonts/TachyonArchivo-Heavy.ttf') format('truetype');
  font-weight:800;font-style:normal;font-display:block;
}
:root{
  --bg:#0A0A0B;--ink:#F5F4EF;--dim:#8C8F96;--rule:rgba(245,244,239,.2);
  --signal:#2B3CFF;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.68,.24,1);
  --wm-bg:#0A0A0B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex}
main{
  flex:1;min-width:0;
  display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,28vw,380px);
  gap:clamp(24px,3.6vw,56px);
  padding:clamp(26px,3.6vw,52px);
}
.left{display:flex;flex-direction:column;min-width:0}
.left__mid{margin:auto 0}
.wm{display:block;width:100%;height:auto;color:var(--ink);overflow:visible}
.wm .sig{fill:var(--signal)}
.tag{margin:clamp(16px,2.6vh,26px) 0 0;max-width:34ch;font-size:clamp(14px,1.25vw,18px);line-height:1.5;color:var(--dim)}
.meta{
  display:flex;flex-wrap:wrap;gap:8px 22px;padding-top:clamp(12px,2vh,20px);
  border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
}

/* signs */
.signs{display:flex;flex-direction:column;justify-content:center;min-width:0}
.signs__head{
  display:flex;justify-content:space-between;gap:12px;
  padding-bottom:10px;border-bottom:1px solid var(--ink);
  font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
}
.sign{
  display:grid;grid-template-columns:36px minmax(0,1fr) 32px;align-items:center;
  gap:clamp(10px,1.4vw,18px);
  height:clamp(68px,9.4vh,92px);
  padding:0 clamp(8px,1vw,14px);
  border-bottom:1px solid var(--rule);
  color:var(--ink);text-decoration:none;
  transition:background .2s linear,color .2s linear,padding .25s var(--ease);
}
.sign svg{width:clamp(24px,2.2vw,28px);height:auto;display:block;stroke:currentColor;fill:none;stroke-width:1.7}
.sign__name{font-size:clamp(18px,1.9vw,24px);font-weight:600;letter-spacing:-.01em;line-height:1}
.sign__arw{justify-self:end;font-size:clamp(18px,1.8vw,24px);color:var(--dim);transition:transform .3s var(--ease),color .2s linear}
.sign:hover,.sign:focus-visible{background:var(--signal);color:#fff;outline:none;padding-left:clamp(14px,1.6vw,22px)}
.sign:hover .sign__arw,.sign:focus-visible .sign__arw{transform:translateX(5px);color:#fff}
.sign:focus-visible{box-shadow:inset 0 0 0 2px #fff}

/* access band */
.band{
  width:clamp(52px,4.4vw,66px);flex:none;background:var(--signal);
  display:flex;align-items:center;justify-content:center;
  transition:filter .2s linear;
}
.band:hover{filter:brightness(.92)}
.band a{
  writing-mode:vertical-rl;transform:rotate(180deg);
  display:flex;align-items:center;gap:12px;
  color:#fff;text-decoration:none;
  font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;
}
.band i{font-style:normal;font-size:13px;letter-spacing:0}

/* entrance */
.js .wm .wmp{opacity:0;transform:translateY(9px)}
.js .sign{opacity:0;transform:translateX(-22px)}
.js .band{transform:scaleY(0);transform-origin:top}
.js .tag,.js .meta,.js .signs__head{opacity:0}
.is-in .wm .wmp{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease)}
.is-in .wm .wmp[data-i="1"]{transition-delay:.06s}
.is-in .wm .wmp[data-i="2"]{transition-delay:.12s}
.is-in .wm .wmp[data-i="3"]{transition-delay:.18s}
.is-in .wm .wmp[data-i="4"]{transition-delay:.24s}
.is-in .wm .wmp[data-i="5"]{transition-delay:.3s}
.is-in .wm .wmp[data-i="6"]{transition-delay:.36s}
.is-in .wm .wmp[data-i="7"]{transition-delay:.42s}
.is-in .tag{opacity:1;transition:opacity .55s linear .3s}
.is-in .meta{opacity:1;transition:opacity .5s linear .5s}
.is-in .signs__head{opacity:1;transition:opacity .45s linear .3s}
.is-in .sign{opacity:1;transform:none;transition:opacity .5s var(--ease),transform .55s var(--ease),background .2s linear,color .2s linear,padding .25s var(--ease)}
.is-in .sign:nth-child(2){transition-delay:.34s}
.is-in .sign:nth-child(3){transition-delay:.4s}
.is-in .sign:nth-child(4){transition-delay:.46s}
.is-in .sign:nth-child(5){transition-delay:.52s}
.is-in .band{transform:scaleY(1);transition:transform .8s var(--ease) .1s,filter .2s linear}
.settled *{transition:none!important;animation:none!important}

@media (max-width:860px){
  body{flex-direction:column;height:100svh}
  main{grid-template-columns:1fr;gap:clamp(18px,3vh,30px);padding:22px 22px 18px}
  .left__mid{margin:0}
  .wm{width:100%}
  .meta{margin-top:18px;padding-top:10px}
  .signs{justify-content:flex-start}
  .sign{height:clamp(58px,8vh,72px)}
  .band{width:100%;height:52px;flex:none}
  .band a{writing-mode:horizontal-tb;transform:none;letter-spacing:.18em}
}
@media (max-width:520px){
  .meta{gap:6px 16px;font-size:7.5px}
  .signs__head{font-size:7px}
}
</style>
</head>
<body>

<script>

  if(q.indexOf('still')>-1||matchMedia('(prefers-reduced-motion: reduce)').matches){
