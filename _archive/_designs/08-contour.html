<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tachyon Lab — 08 Contour</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script>document.documentElement.className += ' js';</script>
<style>
@font-face{
  font-family:'Tachyon Archivo Heavy';
  src:url('../brand/fonts/TachyonArchivo-Heavy.ttf') format('truetype');
  font-weight:800;font-style:normal;font-display:block;
}
:root{
  --bg:#EFEDE4;--ink:#25322C;--dim:#6B7A72;--rule:rgba(37,50,44,.3);
  --grid:rgba(37,50,44,.08);
  --signal:#2B3CFF;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Work Sans',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.68,.24,1);
  --wm-bg:#EFEDE4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  position:relative;margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;
  height:100svh;padding:clamp(16px,2.2vw,26px) clamp(18px,2.6vw,34px);
  display:flex;flex-direction:column;
}
.terrain{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.grid{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(to right,var(--grid) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:64px 64px;
}
header,main,footer{position:relative;z-index:1}
header{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-bottom:9px;border-bottom:1px solid var(--ink);
  font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
}
header b{font-weight:400;color:var(--ink)}

main{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:space-between;gap:clamp(18px,3vw,44px);padding:clamp(12px,2vh,20px) 0;position:relative}
.left{min-width:0;max-width:min(62vw,740px)}
.note{
  display:flex;align-items:flex-start;gap:10px;margin:0 0 10px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
}
.note i{width:22px;height:1px;background:var(--ink);margin-top:6px;flex:none}
.note em{font-family:var(--sans);font-style:italic;font-size:clamp(13px,1.2vw,15px);letter-spacing:0;text-transform:none;color:var(--ink);line-height:1.4}
.plate{background:var(--bg);border:1px solid var(--rule);padding:clamp(10px,1.5vw,20px)}
.wm{display:block;width:100%;height:auto;color:var(--ink);overflow:visible}
.wm .sig{fill:var(--signal)}

.north{position:absolute;top:4px;right:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--dim)}
.north svg{width:22px;height:30px;display:block}

.legend{
  width:clamp(220px,23vw,280px);flex:none;background:var(--bg);
  border:1px solid var(--ink);padding:11px 12px 6px;
}
.legend__h{
  display:flex;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--ink);
  font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
}
.legend a{
  display:grid;grid-template-columns:16px minmax(0,1fr) 14px;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px solid var(--rule);
  color:var(--ink);text-decoration:none;transition:background .18s linear;
}
.legend a:last-child{border-bottom:0}
.legend a:hover,.legend a:focus-visible{background:rgba(43,60,255,.08);outline:none}
.legend a:focus-visible{box-shadow:inset 0 0 0 1px var(--signal)}
.legend svg{width:13px;height:13px;display:block;stroke:var(--ink);fill:none;stroke-width:1.3}
.legend span{font-size:clamp(11px,1vw,13px);line-height:1.2}
.legend i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);justify-self:end}

footer{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  border-top:1px solid var(--ink);padding-top:10px;
  font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
}
.scale{display:flex;align-items:center;gap:9px}
.scale__bar{display:flex;width:clamp(110px,12vw,160px);height:6px;border:1px solid var(--ink)}
.scale__bar i{flex:1;display:block}
.scale__bar i:nth-child(1),.scale__bar i:nth-child(3){background:var(--ink)}
.access{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--signal);padding-bottom:2px;display:inline-flex;gap:6px;white-space:nowrap}
.access i{font-style:normal;color:var(--signal)}

/* contours */
.ct{stroke-dasharray:1;stroke-dashoffset:1}
.is-in .ct{stroke-dashoffset:0;transition:stroke-dashoffset 1.15s var(--ease)}
.is-in .ct:nth-child(1){transition-delay:.05s}
.is-in .ct:nth-child(2){transition-delay:.11s}
.is-in .ct:nth-child(3){transition-delay:.17s}
.is-in .ct:nth-child(4){transition-delay:.23s}
.is-in .ct:nth-child(5){transition-delay:.29s}
.is-in .ct:nth-child(6){transition-delay:.35s}
.is-in .ct:nth-child(7){transition-delay:.41s}
.is-in .ct:nth-child(8){transition-delay:.47s}
.is-in .ct:nth-child(9){transition-delay:.53s}
.is-in .ct:nth-child(10){transition-delay:.59s}

/* entrance */
.js .wm .wmp{opacity:0;transform:translateY(8px)}
.js .legend,.js .note,.js .north,.js .scale,.js .access,.js .plate{opacity:0}
.is-in .wm .wmp{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease)}
.is-in .wm .wmp[data-i="1"]{transition-delay:.28s}
.is-in .wm .wmp[data-i="2"]{transition-delay:.33s}
.is-in .wm .wmp[data-i="3"]{transition-delay:.38s}
.is-in .wm .wmp[data-i="4"]{transition-delay:.42s}
.is-in .wm .wmp[data-i="5"]{transition-delay:.46s}
.is-in .wm .wmp[data-i="6"]{transition-delay:.5s}
.is-in .wm .wmp[data-i="7"]{transition-delay:.54s}
.is-in .plate{opacity:1;transition:opacity .4s linear .22s}
.is-in .note{opacity:1;transition:opacity .5s linear .34s}
.is-in .legend{opacity:1;transition:opacity .5s linear .5s}
.is-in .north{opacity:1;transition:opacity .4s linear .58s}
.is-in .scale{opacity:1;transition:opacity .4s linear .62s}
.is-in .access{opacity:1;transition:opacity .4s linear .66s}
.settled *{transition:none!important;animation:none!important}
.settled .ct{stroke-dashoffset:0}

@media (max-width:860px){
  body{overflow:auto;height:auto;min-height:100svh}
  main{flex-direction:column;align-items:stretch;justify-content:flex-end;gap:14px;padding-top:20px}
  .left{max-width:none}
  .north{top:0}
  .legend{width:100%}
  .legend a{padding:8px 0}
  footer{flex-direction:column;align-items:flex-start;gap:10px;padding-top:12px}
}
@media (max-width:520px){
  .note em{font-size:13px}
  .plate{padding:9px}
}
</style>
