<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Tachyon Lab — 05 Telex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>document.documentElement.className += ' js';</script>
<style>
@font-face{
  font-family:'Tachyon Archivo Heavy';
  src:url('../brand/fonts/TachyonArchivo-Heavy.ttf') format('truetype');
  font-weight:800;font-style:normal;font-display:block;
}
:root{
  --bg:#E8E7DF;--ink:#17181A;--dim:#5E6066;--rule:rgba(23,24,26,.24);
  --signal:#2B3CFF;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.68,.24,1);
  --wm-bg:#E8E7DF;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
.tape{
  position:relative;height:100svh;overflow:hidden;
  padding:clamp(22px,4vh,44px) clamp(34px,5vw,72px);
}
.tape::before,.tape::after{
  content:"";position:absolute;top:0;bottom:0;width:22px;
  background-image:radial-gradient(circle at 11px 13px,rgba(23,24,26,.28) 2.6px,transparent 3.1px);
  background-size:22px 26px;
}
.tape::before{left:0;border-right:1px solid var(--rule)}
.tape::after{right:0;border-left:1px solid var(--rule)}
.col{height:100%;display:flex;flex-direction:column;min-width:0}

.hdr{border-bottom:1px solid var(--ink);padding-bottom:12px;font-size:10px;line-height:1.9;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.hdr .line{white-space:nowrap;overflow:hidden}
.hdr .line:first-child{color:var(--ink)}
.cursor{display:inline-block;width:7px;height:11px;background:var(--signal);vertical-align:-1px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.wm{display:block;width:min(100%,620px);height:auto;color:var(--ink);overflow:visible;margin:clamp(18px,4vh,40px) 0 0}
.wm .sig{fill:var(--signal)}

.msg{
  margin:clamp(14px,3vh,26px) 0 0;
  max-width:58ch;
  font-size:clamp(11px,1vw,12.5px);
  line-height:1.9;
  letter-spacing:.02em;
  text-transform:uppercase;
}

.nav{margin-top:clamp(18px,4vh,42px);border-top:1px solid var(--ink);flex:1;display:flex;flex-direction:column}
.nav a{
  flex:1;min-height:40px;
  display:grid;grid-template-columns:18px minmax(0,1fr) auto;
  align-items:center;gap:10px;
  min-height:clamp(46px,6.4vh,60px);
  border-bottom:1px solid var(--rule);
  color:var(--ink);text-decoration:none;font-size:clamp(12px,1.1vw,14px);
  letter-spacing:.06em;text-transform:uppercase;
  transition:background .18s linear,color .18s linear;
}
.nav a em{font-style:normal;color:var(--signal)}
.nav a span:last-child{color:var(--dim);transition:transform .26s var(--ease),color .18s linear}
.nav a:hover,.nav a:focus-visible{background:var(--ink);color:var(--bg);outline:none}
.nav a:hover em,.nav a:focus-visible em{color:var(--bg)}
.nav a:hover span:last-child,.nav a:focus-visible span:last-child{color:var(--bg);transform:translateX(4px)}
.nav a:focus-visible{box-shadow:inset 0 0 0 2px var(--signal)}

.foot{margin-top:auto;padding-top:clamp(14px,3vh,26px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.access{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--signal);padding-bottom:2px;display:inline-flex;gap:6px}
.access i{font-style:normal;color:var(--signal)}
.end{white-space:nowrap}

/* entrance */
.js .wm .wmp{opacity:0;transform:translateY(8px)}
.js .msg,.js .nav,.js .foot,.js .hdr .line:nth-child(2),.js .hdr .line:nth-child(3){opacity:0}
.js .nav a{clip-path:inset(0 100% 0 0)}
.is-in .wm .wmp{opacity:1;transform:none;transition:opacity .65s var(--ease),transform .65s var(--ease)}
.is-in .wm .wmp[data-i="1"]{transition-delay:.04s}
.is-in .wm .wmp[data-i="2"]{transition-delay:.09s}
.is-in .wm .wmp[data-i="3"]{transition-delay:.14s}
.is-in .wm .wmp[data-i="4"]{transition-delay:.18s}
.is-in .wm .wmp[data-i="5"]{transition-delay:.22s}
.is-in .wm .wmp[data-i="6"]{transition-delay:.26s}
.is-in .wm .wmp[data-i="7"]{transition-delay:.3s}
.is-in .hdr .line:nth-child(2){opacity:1;transition:opacity .3s linear .08s}
.is-in .hdr .line:nth-child(3){opacity:1;transition:opacity .3s linear .16s}
.is-in .msg{opacity:1;transition:opacity .5s linear .3s}
.is-in .nav{opacity:1;transition:opacity .3s linear .34s}
.is-in .nav a{clip-path:inset(0 0 0 0);transition:clip-path .5s var(--ease),background .18s linear,color .18s linear}
.is-in .nav a:nth-child(1){transition-delay:.36s,0s,0s}
.is-in .nav a:nth-child(2){transition-delay:.42s,0s,0s}
.is-in .nav a:nth-child(3){transition-delay:.48s,0s,0s}
.is-in .nav a:nth-child(4){transition-delay:.54s,0s,0s}
.is-in .foot{opacity:1;transition:opacity .5s linear .6s}
.settled *{transition:none!important;animation:none!important}

@media (max-width:760px){
  .tape{padding:18px 26px}
  .wm{width:100%}
  .hdr{font-size:9px}
  .msg{font-size:11px}
  .foot{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (max-height:720px){
  .wm{width:min(100%,400px)}
  .nav a{min-height:38px}
  .msg{margin-top:12px}
}
</style>
</head>
<body>

    </svg>

    <p class="msg">Local-first AI that runs on your machine, not in the cloud.</p>

    <nav class="nav" aria-label="Sections">

</div>

<script>
(function(){
  var r=document.documentElement,q=location.search;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var l1=document.getElementById('line1');
  var text='Tachyon Lab / Telex 01';
  if(q.indexOf('still')>-1||reduce){
    l1.textContent=text;
    r.classList.add('is-in','settled');
    return;
  }
  var i=0;
  (function tick(){
    l1.textContent=text.slice(0,i);
    i++;
    if(i<=text.length){setTimeout(tick,16);}
    else{setTimeout(function(){r.classList.add('is-in')},90);}
  })();
})();
</script>
