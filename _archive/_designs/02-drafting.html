<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Tachyon Lab — 02 Drafting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script>document.documentElement.className += ' js';</script>
<style>
@font-face{
  font-family:'Tachyon Archivo Heavy';
  src:url('../brand/fonts/TachyonArchivo-Heavy.ttf') format('truetype');
  font-weight:800;font-style:normal;font-display:block;
}
:root{
  --bg:#E9EDF2;
  --ink:#0C1B33;
  --dim:#5C6B85;
  --rule:rgba(12,27,51,.26);
  --grid:rgba(12,27,51,.07);
  --signal:#2B3CFF;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.68,.24,1);
  --wm-bg:#E9EDF2;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;
}
.sheet{
  position:fixed;
  inset:clamp(10px,1.8vw,20px);
  border:1px solid var(--rule);
  padding:clamp(16px,2.2vw,26px);
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:clamp(12px,2vh,22px);
  overflow:hidden;
}
.sheet::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(to right,var(--grid) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
}
.reg{position:absolute;width:11px;height:11px;pointer-events:none}
.reg::before,.reg::after{content:"";position:absolute;background:var(--ink);opacity:.7}
.reg::before{width:11px;height:1px;top:5px;left:0}
.reg::after{width:1px;height:11px;left:5px;top:0}
.reg--tl{top:6px;left:6px}.reg--tr{top:6px;right:6px}
.reg--bl{bottom:6px;left:6px}.reg--br{bottom:6px;right:6px}

/* ---- head ---- */
.head{
  position:relative;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:16px;
  padding-bottom:8px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
}
.head span:last-child{text-align:right}
.head span:first-child{color:var(--ink)}

/* ---- main ---- */
main{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);
  gap:clamp(18px,3vw,44px);
  min-height:0;
}
.left{display:grid;grid-template-rows:auto 1fr;gap:clamp(16px,3vh,28px);min-width:0}
.note{display:flex;align-items:flex-start;gap:12px;max-width:52ch}
.note__tick{position:relative;flex:none;width:46px;height:1px;background:var(--ink);margin-top:9px}
.note__tick::after{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border:1px solid var(--ink);border-radius:50%;background:var(--bg)}
.note p{margin:0;font-family:var(--mono);font-size:clamp(11px,1vw,12.5px);line-height:1.6;color:var(--ink)}

/* figure + dimensions */
.figure{position:relative;padding:30px 0 0 30px;align-self:center;margin-top:0}
.wm{display:block;width:100%;height:auto;color:var(--ink);overflow:visible}
.wm .sig{fill:var(--signal)}
.dim{position:absolute;display:flex;align-items:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--dim);overflow:hidden}
.dim i{flex:1;height:1px;background:var(--rule);display:block}
.dim span{padding:0 7px;white-space:nowrap}
.dim--h{top:0;left:30px;right:0;height:20px}
.dim--v{top:30px;bottom:0;left:0;width:20px;flex-direction:column}
.dim--v i{width:1px;height:auto}
.dim--v span{padding:7px 0;writing-mode:vertical-rl;transform:rotate(180deg)}
.dim::before,.dim::after{content:"";position:absolute;background:var(--rule)}
.dim--h::before,.dim--h::after{width:1px;height:6px;top:7px}
.dim--h::before{left:0}.dim--h::after{right:0}
.dim--v::before,.dim--v::after{height:1px;width:6px;left:7px}
.dim--v::before{top:0}.dim--v::after{bottom:0}

/* ---- side ---- */
.side{display:flex;flex-direction:column;gap:clamp(14px,2.6vh,26px);min-height:0}
.detail{display:flex;align-items:flex-end;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.detail__k{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
.detail b{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.detail__body{flex:1;min-width:0}
.mark{display:block;width:clamp(92px,9vw,132px);height:auto;color:var(--ink);flex:none}

/* index table */
.index{margin-top:auto}
.index__head,.index a{
  display:grid;grid-template-columns:36px minmax(0,1fr) 30px;
  align-items:center;gap:10px;
}
.index__head{
  height:22px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
}
.index a{
  min-height:clamp(36px,5.2vh,48px);
  border-bottom:1px solid var(--rule);
  color:var(--ink);text-decoration:none;
  transition:background .2s linear;
}
.index a span:first-child{font-family:var(--mono);font-size:10px;color:var(--dim)}
.index a span:nth-child(2){font-size:clamp(13px,1.2vw,15px);font-weight:500;letter-spacing:-.01em}
.index a span:last-child{justify-self:end;font-family:var(--mono);font-size:11px;color:var(--dim);transition:transform .28s var(--ease),color .2s linear}
.index a:hover,.index a:focus-visible{background:rgba(43,60,255,.06);outline:none}
.index a:hover span:last-child,.index a:focus-visible span:last-child{transform:translateX(4px);color:var(--signal)}
.index a:focus-visible{box-shadow:inset 2px 0 0 var(--signal)}

/* ---- title block ---- */
.block{
  display:grid;
  grid-template-columns:1.4fr .8fr .6fr .8fr 1.2fr;
  border:1px solid var(--rule);
  min-height:clamp(48px,7vh,66px);
}
.block>div,.block>a{
  padding:8px 12px;
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  text-decoration:none;color:var(--ink);
}
.block>a{border-right:0;transition:background .2s linear}
.block>a:hover{background:rgba(43,60,255,.07)}
.block span{font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.block b{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.block a b{color:var(--signal)}

/* ---- entrance ---- */
.js .wm .wmp{opacity:0;transform:translateY(8px)}
.js .dim{clip-path:inset(0 100% 0 0)}
.js .dim--v{clip-path:inset(0 0 100% 0)}
.js .index a{clip-path:inset(0 100% 0 0)}
.js .block,.js .note,.js .detail{opacity:0}
.is-in .wm .wmp{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease)}
.is-in .wm .wmp[data-i="1"]{transition-delay:.2s}
.is-in .wm .wmp[data-i="2"]{transition-delay:.25s}
.is-in .wm .wmp[data-i="3"]{transition-delay:.3s}
.is-in .wm .wmp[data-i="4"]{transition-delay:.34s}
.is-in .wm .wmp[data-i="5"]{transition-delay:.38s}
.is-in .wm .wmp[data-i="6"]{transition-delay:.42s}
.is-in .wm .wmp[data-i="7"]{transition-delay:.46s}
.is-in .dim{clip-path:inset(0 0 0 0);transition:clip-path .8s var(--ease) .05s}
.is-in .dim--v{transition-delay:.12s}
.is-in .index a{clip-path:inset(0 0 0 0);transition:clip-path .55s var(--ease),background .2s linear}
.is-in .index a:nth-child(2){transition-delay:.42s,0s}
.is-in .index a:nth-child(3){transition-delay:.48s,0s}
.is-in .index a:nth-child(4){transition-delay:.54s,0s}
.is-in .index a:nth-child(5){transition-delay:.6s,0s}
.is-in .note,.is-in .detail{opacity:1;transition:opacity .5s linear .1s}
.is-in .block{opacity:1;transition:opacity .6s linear .55s}
.settled *{transition:none!important;animation:none!important}

@media (max-width:860px){
  body{overflow:auto;height:auto}
  .sheet{position:static;inset:auto;margin:10px;min-height:calc(100svh - 20px);overflow:visible}
  main{grid-template-columns:1fr;gap:20px}
  .figure{padding:0;margin:0}
  .dim{display:none}
  .sheet{display:flex;flex-direction:column}
  .left{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
  .figure{align-self:stretch;padding:0}
  .index a{min-height:clamp(46px,7vh,62px)}
  main{flex:1;display:flex;flex-direction:column;justify-content:space-between}
  .side{display:block}
  .detail{display:none}
  .index{margin-top:0}
  .block{grid-template-columns:1fr 1fr;margin-top:4px}
  .block>*{border-bottom:1px solid var(--rule)}
  .block>*:nth-child(2n){border-right:0}
  .block>*:nth-child(n+5){border-bottom:0}
}
@media (max-width:520px){
  .head span:nth-child(2){display:none}
  .note__tick{width:24px}
  .block{grid-template-columns:1fr 1fr}
  .block>*{border-right:1px solid var(--rule)}
  .block>*:nth-child(2n){border-right:0}
  .block>*:nth-child(5){grid-column:1 / -1;border-right:0}
  .block>div,.block>a{padding:7px 10px}
}
</style>
</head>
