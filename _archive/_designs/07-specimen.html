<style>
@font-face{
  font-family:'Tachyon Archivo Heavy';
  src:url('../brand/fonts/TachyonArchivo-Heavy.ttf') format('truetype');
  font-weight:800;font-style:normal;font-display:block;
}
:root{
  --bg:#F7F5EF;--ink:#111111;--dim:#6E6A60;--rule:rgba(17,17,17,.18);
  --grid:rgba(17,17,17,.075);
  --signal:#2B3CFF;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.68,.24,1);
  --wm-bg:#F7F5EF;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 24px);
}
.spec{height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(16px,2.4vw,30px) clamp(20px,3vw,38px);gap:clamp(10px,1.6vh,18px)}
.top{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:16px;
  padding-bottom:8px;border-bottom:1px solid var(--ink);
  font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
}
.top span:first-child{color:var(--ink)}
.top span:last-child{text-align:right}

.main{display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3.4vh,34px);min-height:0}
.display{min-width:0}
.lbl{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.wm{display:block;height:auto;color:var(--ink);overflow:visible}
.wm .sig,.sig{fill:var(--signal)}
.wm--display{width:min(100%,118vh)}
.sizes{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:clamp(16px,3vw,40px);align-items:end;border-top:1px solid var(--rule);padding-top:12px}
.sizes>div{min-width:0}
.wm--text{width:min(100%,300px)}
.wm--cap{width:140px}
.mark{display:block;width:120px;height:auto;color:var(--ink)}

.chars{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink)}
.chars a{
  display:flex;flex-direction:column;gap:2px;min-width:0;
  padding:10px 12px 10px 0;border-right:1px solid var(--rule);
  color:var(--ink);text-decoration:none;transition:background .18s linear;
}
.chars a:last-child{border-right:0}
.chars a:hover,.chars a:focus-visible{background:rgba(43,60,255,.07);outline:none}
.chars a:focus-visible{box-shadow:inset 0 0 0 1px var(--signal)}
.chars b{font-family:var(--mono);font-size:clamp(20px,2vw,28px);font-weight:400;line-height:1;color:var(--dim)}
.chars span{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase}
.chars i{font-style:normal;color:var(--signal);font-family:var(--mono);font-size:11px;margin-top:4px}

.foot{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  border-top:1px solid var(--rule);padding-top:10px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--dim);
}
.foot p{margin:0;max-width:46ch;font-family:var(--sans);font-size:12.5px;line-height:1.5;letter-spacing:0;color:var(--ink)}
.access{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--signal);padding-bottom:2px;white-space:nowrap;display:inline-flex;gap:6px;text-transform:uppercase}
.access i{font-style:normal;color:var(--signal)}

/* entrance */
.js .wm--display{opacity:0;transform:scale(1.03);transform-origin:left center}
.js .wm--text,.js .wm--cap,.js .mark,.js .chars,.js .foot,.js .lbl{opacity:0}
.is-in .wm--display{opacity:1;transform:none;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.is-in .lbl{opacity:1;transition:opacity .4s linear .18s}
.is-in .wm--text{opacity:1;transition:opacity .55s linear .38s}
.is-in .wm--cap{opacity:1;transition:opacity .55s linear .46s}
.is-in .mark{opacity:1;transition:opacity .55s linear .54s}
.is-in .chars{opacity:1;transition:opacity .5s linear .5s}
.is-in .foot{opacity:1;transition:opacity .5s linear .64s}
.settled *{transition:none!important;animation:none!important}

@media (max-width:820px){
  .wm--display{width:100%}
  .main{justify-content:space-between;gap:14px}
  .sizes{grid-template-columns:1fr;row-gap:10px;align-items:start}
  .sizes>div{display:flex;flex-direction:column;align-items:flex-start}
  .wm--text{width:min(100%,300px)}
  .wm--cap{width:140px}
  .mark{width:64px}
  .chars{grid-template-columns:1fr 1fr}
  .chars a:nth-child(2){border-right:0}
  .chars a:nth-child(1),.chars a:nth-child(2){border-bottom:1px solid var(--rule)}
  .foot{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (max-height:700px){
  .sizes{display:none}
}
</style>
</head>
