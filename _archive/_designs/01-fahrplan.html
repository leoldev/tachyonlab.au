<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tachyon Lab — 01 Fahrplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
@font-face{
  font-family:'Tachyon Archivo Heavy';
  src:url('../brand/fonts/TachyonArchivo-Heavy.ttf') format('truetype');
  font-weight:800;font-style:normal;font-display:block;
}
:root{
  --bg:#08080A;
  --ink:#F2F0E9;
  --dim:#8B8D95;
  --rule:rgba(242,240,233,.16);
  --signal:#2B3CFF;
  --sans:'Inter Tight',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(18px,3.2vw,44px);
  --ease:cubic-bezier(.22,.68,.24,1);
  --wm-bg:#08080A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body{display:flex;flex-direction:column;padding:0 var(--pad)}

/* ---- top bar ---- */
.bar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:16px;
  height:clamp(42px,6vh,56px);
  border-bottom:1px solid var(--rule);
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--dim);
}
.bar span:last-child{text-align:right}

/* ---- main ---- */
main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:clamp(18px,3.4vh,34px);
  padding:clamp(14px,3vh,30px) 0;
}
.mast{display:flex;align-items:flex-end;gap:28px}
.wm{
  display:block;
  width:min(64vw,860px);
  height:auto;
  color:var(--ink);
  overflow:visible;
}
.wm .sig{fill:var(--signal)}
.mast__meta{
  display:flex;
  flex-direction:column;
  gap:4px;
  padding-bottom:6px;
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--dim);
  text-align:right;
  white-space:nowrap;
}

/* ---- departure board ---- */
.board{border-top:1px solid var(--rule2,rgba(242,240,233,.3))}
.board__label{
  display:flex;
  align-items:center;
  gap:9px;
  height:clamp(26px,3.4vh,34px);
  border-bottom:1px solid var(--rule);
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--dim);
}
.board__label i{width:6px;height:6px;background:var(--signal);display:block}
.board__label span:last-child{margin-left:auto;color:var(--dim)}

.board__head,.row{
  display:grid;
  grid-template-columns:clamp(48px,5vw,72px) minmax(0,1fr) clamp(90px,12vw,150px) clamp(34px,3vw,48px);
  align-items:center;
  gap:clamp(10px,2vw,24px);
}
.board__head{
  height:clamp(24px,3vh,30px);
  border-bottom:1px solid var(--rule);
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--dim);
}
.board__head span:nth-child(3){text-align:left}

.row{
  position:relative;
  min-height:clamp(56px,8.6vh,84px);
  border-bottom:1px solid var(--rule);
  color:var(--ink);
  text-decoration:none;
  transition:background .22s linear;
}
.row__no,.row__plat{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  color:var(--dim);
}
.row__name{
  font-size:clamp(20px,2.3vw,30px);
  font-weight:500;
  letter-spacing:-.02em;
  line-height:1;
}
.row__arrow{
  justify-self:end;
  font-family:var(--mono);
  font-size:16px;
  color:var(--dim);
  transition:transform .3s var(--ease),color .22s linear;
}
.row:hover,.row:focus-visible{background:rgba(242,240,233,.04);outline:none}
.row:hover .row__arrow,.row:focus-visible .row__arrow{transform:translateX(6px);color:var(--signal)}
.row:focus-visible{box-shadow:inset 2px 0 0 var(--signal)}
.row::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:2px;
  background:var(--signal);
  transform:scaleY(0);
  transform-origin:top;
  transition:transform .3s var(--ease);
}
.row:hover::before,.row:focus-visible::before{transform:scaleY(1)}

/* ---- footer ---- */
footer{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:28px;
  padding:clamp(14px,2.6vh,24px) 0 clamp(16px,3vh,26px);
  border-top:1px solid var(--rule);
}
footer p{
  margin:0;
  max-width:44ch;
  font-size:clamp(12px,1.1vw,14px);
  line-height:1.5;
  color:var(--ink);
}
.access{
  flex:none;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding-bottom:3px;
  border-bottom:1px solid var(--signal);
  color:var(--ink);
  text-decoration:none;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  white-space:nowrap;
}
.access i{font-style:normal;color:var(--signal)}

/* ---- entrance ---- */
.js .wm .wmp{opacity:0;transform:translateY(9px)}
.js .board,.js footer{opacity:0}
.js .row{clip-path:inset(0 100% 0 0)}
.is-in .wm .wmp{
  opacity:1;transform:none;
  transition:opacity .72s var(--ease),transform .72s var(--ease);
}
.is-in .wm .wmp[data-i="1"]{transition-delay:.02s}
.is-in .wm .wmp[data-i="2"]{transition-delay:.07s}
.is-in .wm .wmp[data-i="3"]{transition-delay:.12s}
.is-in .wm .wmp[data-i="4"]{transition-delay:.16s}
.is-in .wm .wmp[data-i="5"]{transition-delay:.2s}
.is-in .wm .wmp[data-i="6"]{transition-delay:.24s}
.is-in .wm .wmp[data-i="7"]{transition-delay:.28s}
.is-in .board{opacity:1;transition:opacity .5s linear .34s}
.is-in .row{
  clip-path:inset(0 0 0 0);
  transition:clip-path .62s var(--ease),background .22s linear;
}
.is-in .row:nth-child(2){transition-delay:.38s,.0s}
.is-in .row:nth-child(3){transition-delay:.44s,.0s}
.is-in .row:nth-child(4){transition-delay:.5s,.0s}
.is-in .row:nth-child(5){transition-delay:.56s,.0s}
.is-in footer{opacity:1;transition:opacity .6s linear .62s}
.settled *{transition:none!important;animation:none!important}

@media (max-width:760px){
  .bar span:nth-child(2){display:none}
  .board{flex:1;display:flex;flex-direction:column}
  .row{flex:1;min-height:60px;max-height:104px}
  .mast{flex-direction:column;align-items:flex-start;gap:10px}
  .wm{width:100%}
  .mast__meta{flex-direction:row;gap:14px;text-align:left;padding:0}
  .board__head,.row{grid-template-columns:38px minmax(0,1fr) 30px}
  .board__head span:nth-child(3),.row__plat{display:none}
  .row__name{font-size:clamp(18px,5vw,22px)}
  footer{flex-direction:column;align-items:flex-start;gap:12px}
}
@media (max-height:700px){
  .mast__meta{display:none}
  main{gap:14px;padding:10px 0}
  .row{min-height:48px}
}
</style>
</head>
