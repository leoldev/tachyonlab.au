<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Tachyon Lab — 04 Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script>document.documentElement.className += ' js';</script>
<style>
@font-face{
  font-family:'Tachyon Archivo Heavy';
  src:url('../brand/fonts/TachyonArchivo-Heavy.ttf') format('truetype');
  font-weight:800;font-style:normal;font-display:block;
}
:root{
  --bg:#F3EFE3;--ink:#1A1712;--dim:#6B6252;--rule:#CFC5AE;
  --signal:#2B3CFF;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --serif:'Newsreader',Georgia,serif;
  --ease:cubic-bezier(.22,.68,.24,1);
  --wm-bg:#F3EFE3;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden}
.spread{
  height:100svh;display:grid;grid-template-columns:64% 36%;
  position:relative;
}
.page{position:relative;padding:clamp(24px,3.4vw,46px);display:flex;flex-direction:column;min-width:0}
.page--right{border-left:1px solid var(--rule);background:rgba(26,23,18,.018)}
.page::before{
  content:"";position:absolute;top:0;bottom:0;left:clamp(14px,1.6vw,22px);width:1px;
  background:rgba(43,60,255,.32);
}
.folio{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  display:flex;justify-content:space-between;gap:12px;
}
.left__mid{margin:auto 0;padding:clamp(16px,4vh,40px) 0}
.wm{display:block;width:100%;height:auto;color:var(--ink);overflow:visible}
.wm .sig{fill:var(--signal)}
.tag{
  margin:clamp(18px,3.4vh,32px) 0 0;
  max-width:30ch;
  font-size:clamp(17px,1.8vw,24px);
  line-height:1.32;
  font-style:italic;
  letter-spacing:-.005em;
}
.imprint{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  border-top:1px solid var(--rule);padding-top:10px;
}

/* right page */
.entries{margin-top:clamp(24px,6vh,58px);flex:1;display:flex;flex-direction:column;min-height:0}
.entries__head,.entry{
  display:grid;grid-template-columns:34px minmax(0,1fr) 22px 20px;
  align-items:baseline;gap:10px;
}
.entries__head{
  padding-bottom:8px;border-bottom:1px solid var(--ink);
  font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
}
.entry{
  flex:none;
  padding:clamp(12px,2.4vh,20px) 0;
  border-bottom:1px solid var(--rule);
  color:var(--ink);text-decoration:none;
  transition:background .2s linear;
}
.entry__no{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dim);font-variant-numeric:tabular-nums}
.entry__name{font-size:clamp(17px,1.7vw,22px);line-height:1;letter-spacing:-.01em}
.entry__ref{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dim);text-align:right}
.entry__arw{font-family:var(--mono);font-size:12px;color:var(--dim);justify-self:end;transition:transform .28s var(--ease),color .2s linear}
.entry:hover,.entry:focus-visible{background:rgba(43,60,255,.07);outline:none}
.entry:hover .entry__arw,.entry:focus-visible .entry__arw{transform:translateX(4px);color:var(--signal)}
.entry:focus-visible{box-shadow:inset 2px 0 0 var(--signal)}

.fill{flex:1;min-height:16px;border-bottom:1px solid rgba(207,197,174,.55)}
.fill:last-of-type{border-bottom:0}
.close{margin-top:clamp(14px,2.6vh,24px);padding-top:0}
.close__rule{border-top:3px double var(--ink);padding-top:14px;display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.close__k{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.access{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:7px;
  border-bottom:1px solid var(--signal);padding-bottom:2px;
}
.access i{font-style:normal;color:var(--signal)}

/* entrance */
.js .wm .wmp{opacity:0;transform:translateY(8px)}
.js .tag,.js .imprint,.js .entries,.js .close,.js .folio{opacity:0}
.js .entry{clip-path:inset(0 100% 0 0)}
.js .page::before{transform:scaleY(0);transform-origin:top}
.is-in .wm .wmp{opacity:1;transform:none;transition:opacity .72s var(--ease),transform .72s var(--ease)}
.is-in .wm .wmp[data-i="1"]{transition-delay:.08s}
.is-in .wm .wmp[data-i="2"]{transition-delay:.14s}
.is-in .wm .wmp[data-i="3"]{transition-delay:.2s}
.is-in .wm .wmp[data-i="4"]{transition-delay:.26s}
.is-in .wm .wmp[data-i="5"]{transition-delay:.32s}
.is-in .wm .wmp[data-i="6"]{transition-delay:.38s}
.is-in .wm .wmp[data-i="7"]{transition-delay:.44s}
.is-in .folio{opacity:1;transition:opacity .5s linear .05s}
.is-in .tag{opacity:1;transition:opacity .6s linear .34s}
.is-in .imprint{opacity:1;transition:opacity .5s linear .5s}
.is-in .entries{opacity:1;transition:opacity .4s linear .28s}
.is-in .entry{clip-path:inset(0 0 0 0);transition:clip-path .55s var(--ease),background .2s linear}
.is-in .entry:nth-child(2){transition-delay:.34s,0s}
.is-in .entry:nth-child(3){transition-delay:.4s,0s}
.is-in .entry:nth-child(4){transition-delay:.46s,0s}
.is-in .entry:nth-child(5){transition-delay:.52s,0s}
.is-in .close{opacity:1;transition:opacity .55s linear .58s}
.is-in .page::before{transform:scaleY(1);transition:transform .9s var(--ease) .1s}
.settled *{transition:none!important;animation:none!important}

@media (max-width:860px){
  body{overflow:auto;height:auto}
  .spread{height:auto;min-height:100svh;grid-template-columns:1fr}
  .page--right{border-left:0;border-top:1px solid var(--rule)}
  .page{min-height:0}
  .left__mid{margin:0;padding:clamp(18px,5vh,40px) 0}
  .entries{margin-top:18px;flex:none;display:block}
  .fill{display:none}
  .close{margin-top:auto;padding-top:24px}
}
@media (max-width:520px){
  .folio span:last-child{display:none}
  .entry{grid-template-columns:28px minmax(0,1fr) 16px}
  .entry__ref{display:none}
  .entries__head span:nth-child(3){display:none}
  .entries__head{grid-template-columns:28px minmax(0,1fr) 16px}
}
</style>
</head>
