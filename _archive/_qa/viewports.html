<!doctype html>
<html><head><meta charset="utf-8"><title>viewport frames</title>
<style>
  html,body{margin:0;background:#222}
  .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:16px}
  iframe{border:0;display:block;background:#000}
</style></head>
<body>
<div class="row">
  <iframe style="width:1440px;height:900px" src="../index.html?nointro=1" title="1440"></iframe>
</div>
<div class="row">
  <iframe style="width:1024px;height:768px" src="../index.html?nointro=1" title="1024"></iframe>
  <iframe style="width:768px;height:1024px" src="../index.html?nointro=1" title="768"></iframe>
</div>
</body></html>
